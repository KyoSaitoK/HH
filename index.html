<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Kinh Tế Chính Trị Mác - Lênin</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #3b82f6;
            --background-color: #f3f4f6;
            --text-color: #1f2937;
            --card-bg: #ffffff;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            background-color: var(--secondary-color);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .timer {
            color: var(--error-color);
            font-weight: bold;
            background: #fee2e2;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            color: #111827;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            color: var(--text-color);
        }

        .option-btn:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }

        /* Chế độ chọn (chưa biết đúng sai) */
        .option-btn.selected {
            background-color: #eff6ff;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: #1e40af;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 15px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 20px 0;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            color: white;
        }

        .restart-btn { background-color: var(--success-color); }
        .restart-btn:hover { background-color: #059669; }
        
        .review-btn { background-color: var(--warning-color); }
        .review-btn:hover { background-color: #d97706; }

        .review-container {
            margin-top: 30px;
            text-align: left;
            display: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .review-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--error-color);
        }

        .review-question {
            font-weight: bold;
            margin-bottom: 10px;
            color: #111827;
        }

        .review-wrong {
            color: var(--error-color);
            margin-bottom: 5px;
            font-size: 15px;
        }

        .review-correct {
            color: var(--success-color);
            font-weight: bold;
            font-size: 15px;
        }

        /* Tùy chỉnh thanh cuộn cho khu vực review */
        .review-container::-webkit-scrollbar { width: 6px; }
        .review-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .review-container::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .review-container::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        @media (max-width: 600px) {
            .quiz-container { padding: 20px; }
            .question-text { font-size: 16px; }
            .score-display { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quiz-screen">
        <div class="header">
            <h1>Bài Thi: Kinh Tế Chính Trị Mác - Lênin</h1>
        </div>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="question-meta">
            <span id="question-number">Câu 1 / 66</span>
            <span class="timer" id="timer">Thời gian: 90:00</span>
        </div>

        <div class="question-text" id="question-text">
            Đang tải câu hỏi...
        </div>

        <div class="options-container" id="options-container">
        </div>

        <div class="controls">
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo ➔</button>
        </div>
    </div>

    <div class="quiz-container result-container" id="result-screen">
        <h2>Hoàn Thành Bài Thi!</h2>
        <p>Bạn đã hoàn thành tất cả các câu hỏi hoặc đã hết thời gian.</p>
        <div class="score-display" id="final-score">0 / 66</div>
        <p id="feedback-message">Cố gắng ôn tập thêm nhé!</p>
        
        <div class="action-buttons">
            <button class="btn restart-btn" onclick="initQuiz()">Làm Lại Bài Thi</button>
            <button class="btn review-btn" id="toggle-review-btn" onclick="toggleReview()">Xem Lại Câu Sai</button>
        </div>

        <div class="review-container" id="review-container">
            <!-- Các câu sai sẽ được render ở đây -->
        </div>
    </div>

    <script>
        const quizData = [{"q": "Thuật ngữ \"kinh tế - chính trị\" được sử dụng lần đầu vào năm nào?", "a": "Năm 1615.", "w": ["Năm 1610.", "Năm 1815.", "Năm 1715."]}, {"q": "Ai là người đầu tiên đưa ra khái niệm \"kinh tế - chính trị\"?", "a": "Antoine Montchretien.", "w": ["Adam Smith.", "Karl Marx.", "David Ricardo."]}, {"q": "Học thuyết kinh tế nào của C.Mác được coi là hòn đá tảng?", "a": "Học thuyết giá trị thặng dư.", "w": ["Học thuyết hình thái kinh tế - xã hội.", "Học thuyết giai cấp.", "Học thuyết tích luỹ tư bản."]}, {"q": "Kinh tế - chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của:", "a": "Kinh tế chính trị cổ điển Anh.", "w": ["Chủ nghĩa xã hội không tưởng Pháp.", "Triết học cổ điển Đức.", "Kinh tế học tư sản hiện đại."]}, {"q": "Đối tượng nghiên cứu của kinh tế - chính trị Mác - Lênin là:", "a": "Quan hệ sản xuất trong mối quan hệ tác động qua lại vs lực lượng sản xuất và kiến trúc thượng tầng.", "w": ["Các quy luật kinh tế của nền sản xuất hàng hóa.", "Sự phát triển của lực lượng sản xuất xã hội.", "Quá trình sản xuất và lưu thông hàng hóa."]}, {"q": "Để nghiên cứu kinh tế - chính trị Mác - Lênin có thể sử dụng nhiều phương pháp, phương pháp nào quan trọng nhất?", "a": "Trừu tượng hoá khoa học.", "w": ["Phân tích và tổng hợp.", "Lịch sử và logic.", "Thống kê và so sánh."]}, {"q": "Chức năng nhận thức của kinh tế - chính trị là nhằm:", "a": "Cả A, B, C đều đúng.", "w": ["Phát hiện bản chất của các hiện tượng và quá trình kinh tế.", "Sự tác động giữa quan hệ sản xuất với lực lượng sản xuất và kiến trúc thượng tầng.", "Tìm ra các quy luật kinh tế."]}, {"q": "Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?", "a": "Hoạt động sản xuất của cải vật chất.", "w": ["Hoạt động chính trị - xã hội.", "Hoạt động nghiên cứu khoa học.", "Hoạt động văn hóa nghệ thuật."]}, {"q": "\"Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào\". Câu nói trên là của ai?", "a": "C.Mác.", "w": ["V.I.Lênin.", "Ph.Ăngghen.", "Adam Smith."]}, {"q": "Các phương thức sản xuất nối tiếp nhau trong lịch sử theo trình tự nào?", "a": "Cộng sản nguyên thuỷ - chiếm hữu nô lệ - phong kiến - tư bản - chủ nghĩa cộng sản.", "w": ["Cộng sản nguyên thuỷ - phong kiến - chiếm hữu nô lệ - tư bản - chủ nghĩa cộng sản.", "Chiếm hữu nô lệ - phong kiến - cộng sản nguyên thuỷ - tư bản - chủ nghĩa xã hội.", "Cộng sản nguyên thuỷ - tư bản - chiếm hữu nô lệ - phong kiến - chủ nghĩa xã hội."]}, {"q": "Khi nghiên cứu phương thức sản xuất TBCN, C.Mác bắt đầu từ:", "a": "Sản xuất hàng hoá giản đơn và hàng hoá.", "w": ["Nền sản xuất tư bản chủ nghĩa.", "Lưu thông hàng hóa.", "Quá trình tích lũy tư bản."]}, {"q": "Sản xuất hàng hoá xuất hiện dựa trên:", "a": "Phân công lao động xã hội và chế độ tư hữu hoặc những hình thức sở hữu khác nhau về tư liệu sản xuất.", "w": ["Sự ra đời của tiền tệ và nhà nước.", "Nhu cầu tiêu dùng vô hạn của con người.", "Sự phát triển của máy móc công nghiệp."]}, {"q": "Hàng hóa là:", "a": "Sản phẩm của lao động có thể thoả mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán.", "w": ["Mọi vật phẩm có ích trong tự nhiên.", "Sản phẩm được tạo ra để tự tiêu dùng.", "Tất cả của cải vật chất trong xã hội."]}, {"q": "Giá trị của hàng hoá được quyết định bởi:", "a": "Lao động trừu tượng của người sản xuất kết tinh trong hàng hoá.", "w": ["Lao động cụ thể của người sản xuất.", "Sự khan hiếm của hàng hóa trên thị trường.", "Giá trị sử dụng của hàng hóa."]}, {"q": "Quy luật giá trị có tác dụng:", "a": "Cả A, B và C.", "w": ["Điều tiết sản xuất và lưu thông hàng hoá.", "Cải tiến kỹ thuật, tăng năng suất lao động.", "Phân hoá giàu nghèo."]}, {"q": "Giá cả hàng hoá là:", "a": "Biểu hiện bằng tiền của giá trị hàng hoá.", "w": ["Sự thỏa thuận giữa người mua và người bán.", "Mức độ khan hiếm của hàng hóa.", "Chi phí sản xuất ra hàng hóa đó."]}, {"q": "Quy luật giá trị là:", "a": "Quy luật cơ bản của sản xuất và trao đổi hàng hoá.", "w": ["Quy luật riêng có của chủ nghĩa tư bản.", "Quy luật kinh tế của thời kỳ quá độ.", "Quy luật của nền kinh tế tự nhiên."]}, {"q": "Lao động trừu tượng là:", "a": "Là lao động tạo ra giá trị của hàng hóa.", "w": ["Là lao động tạo ra giá trị sử dụng của hàng hóa.", "Là lao động trí óc phức tạp.", "Là lao động giản đơn."]}, {"q": "Lao động cụ thể là:", "a": "Là lao động tạo ra giá trị sử dụng của hàng hóa.", "w": ["Là lao động tạo ra giá trị của hàng hóa.", "Là hao phí sức lực nói chung của con người.", "Là lao động chân tay giản đơn."]}, {"q": "Lượng giá trị xã hội của hàng hoá được quyết định bởi:", "a": "Hao phí lao động cần thiết của người sản xuất hàng hoá.", "w": ["Hao phí lao động cá biệt của người sản xuất giỏi nhất.", "Hao phí lao động cá biệt của người sản xuất kém nhất.", "Tổng hao phí lao động của toàn xã hội."]}, {"q": "Hai hàng hoá trao đổi được với nhau vì:", "a": "Có lượng lao động xã hội cần thiết để sản xuất ra chúng bằng nhau.", "w": ["Có giá trị sử dụng giống nhau.", "Có cùng hình thức biểu hiện ra bên ngoài.", "Đáp ứng cùng một nhu cầu của con người."]}, {"q": "Giá trị sử dụng của hàng hóa là gì?", "a": "Là công dụng của sản phẩm có thể thoả mãn nhu cầu nào đó của con người.", "w": ["Là hao phí lao động xã hội cần thiết.", "Là giá cả của hàng hóa trên thị trường.", "Là khả năng trao đổi được với hàng hóa khác."]}, {"q": "Thế nào là lao động giản đơn?", "a": "Là lao động không cần trải qua đào tạo cũng có thể làm được.", "w": ["Là lao động trí óc.", "Là lao động phải trải qua đào tạo, huấn luyện mới làm được.", "Là lao động tạo ra ít giá trị nhất."]}, {"q": "Thế nào là lao động phức tạp?", "a": "Là lao động phải trải qua đào tạo, huấn luyện mới làm được.", "w": ["Là lao động chân tay nặng nhọc.", "Là lao động không cần đào tạo chuyên môn.", "Là lao động chỉ diễn ra trong công nghiệp."]}, {"q": "Chức năng cơ bản của tiền tệ?", "a": "Thước đo giá trị, phương tiện lưu thông, phương tiện thanh toán, phương tiện cất trữ, tiền tệ thế giới.", "w": ["Lưu thông hàng hóa, thanh toán quốc tế, cất trữ, tín dụng.", "Thước đo giá trị, phương tiện mua bán, công cụ quản lý vĩ mô.", "Phương tiện trao đổi, tiền tệ thế giới, lưu thông tư bản."]}, {"q": "Giá cả của hàng hoá được quyết định bởi:", "a": "Cả A, B, C đều đúng.", "w": ["Giá trị của hàng hoá.", "Cung cầu và cạnh tranh.", "Giá trị của tiền tệ trong lưu thông."]}, {"q": "Quan hệ giữa tăng năng suất lao động với giá trị hàng hoá. Chọn ý đúng dưới đây:", "a": "Năng suất lao động tăng lên thì giá trị 1 đơn vị hàng hoá giảm.", "w": ["Năng suất lao động tăng lên thì giá trị 1 đơn vị hàng hoá tăng.", "Năng suất lao động thay đổi không ảnh hưởng đến giá trị 1 đơn vị hàng hóa.", "Năng suất lao động tăng lên thì tổng giá trị hàng hóa giảm."]}, {"q": "Sản xuất và lưu thông hàng hoá chịu sự chi phối của quy luật kinh tế nào?", "a": "Quy luật giá trị.", "w": ["Quy luật cung cầu.", "Quy luật cạnh tranh.", "Quy luật lưu thông tiền tệ."]}, {"q": "Quy luật giá trị có yêu cầu gì?", "a": "Sản xuất và lưu thông hàng hoá phải dựa trên cơ sở hao phí lao động xã hội cần thiết.", "w": ["Sản xuất phải đáp ứng tối đa nhu cầu của xã hội.", "Lưu thông hàng hóa phải thông qua tiền tệ.", "Giá cả phải luôn bằng với giá trị hàng hóa."]}, {"q": "Về bản chất, tiền tệ là:", "a": "Là hàng hoá đặc biệt đóng vai trò là vật ngang giá chung cho các loại hàng hóa.", "w": ["Là quy ước của nhà nước để thuận tiện cho việc mua bán.", "Là tờ giấy bạc do ngân hàng trung ương phát hành.", "Là thước đo sự giàu có của một quốc gia."]}, {"q": "Một trong những đặc trưng phổ biến của kinh tế thị trường?", "a": "Có sự đa dạng của các chủ thể kinh tế, nhiều hình thức sở hữu.", "w": ["Chỉ có sở hữu tư nhân về tư liệu sản xuất.", "Nhà nước bao cấp toàn bộ nền kinh tế.", "Không có sự can thiệp của Nhà nước."]}, {"q": "Mục tiêu hàng đầu của phát triển kinh tế thị trường là gì?", "a": "Giải phóng lực lượng sản xuất, huy động nguồn lực cho CNH, HĐH, cải thiện đời sống Nhân dân.", "w": ["Đảm bảo lợi nhuận tối đa cho các nhà tư bản.", "Xóa bỏ hoàn toàn chế độ tư hữu.", "Mở rộng thị trường ra quốc tế bằng mọi giá."]}, {"q": "Vai trò kinh tế của chủ thể Nhà nước trong kinh tế thị trường:", "a": "Thực hiện chức năng quản lý nhà nước về kinh tế, thực hiện những biện pháp khắc phục những khuyết tật của thị trường.", "w": ["Trực tiếp sản xuất và kinh doanh mọi mặt hàng.", "Định giá cho tất cả các loại hàng hóa trên thị trường.", "Loại bỏ hoàn toàn quy luật giá trị và cạnh tranh."]}, {"q": "Cơ chế thị trường là:", "a": "Là hệ thống các quan hệ mang tính tự điều chỉnh theo yêu cầu của các quy luật của kinh tế.", "w": ["Là sự điều hành nền kinh tế của Nhà nước.", "Là nơi diễn ra các hoạt động mua bán hàng hóa.", "Là các chính sách tài khóa và tiền tệ."]}, {"q": "Cơ chế tác động của quy luật giá trị?", "a": "Giá cả thị trường lên xuống xoay quanh giá trị hàng hóa.", "w": ["Giá cả luôn bằng giá trị hàng hóa.", "Giá cả do Nhà nước hoàn toàn quyết định.", "Giá cả độc lập hoàn toàn với giá trị hàng hóa."]}, {"q": "Cơ chế thị trường được A.Smith ví như là:", "a": "Một \"bàn tay vô hình\" có khả năng tự điều chỉnh các quan hệ kinh tế.", "w": ["Một \"bàn tay hữu hình\" của Nhà nước.", "Một cỗ máy hoạt động theo lập trình sẵn.", "Một cuộc chiến sinh tồn khốc liệt."]}, {"q": "Giá cả thị trường có chức năng gì?", "a": "Cả A, B, C đều đúng", "w": ["Thông tin.", "Phân bố các nguồn lực kinh tế.", "Thúc đẩy tiến bộ khoa học công nghệ."]}, {"q": "Chủ thể sản xuất là chủ thể:", "a": "Là những người sản xuất và cung cấp hàng hóa, dịch vụ ra thị trường nhằm đáp ứng nhu cầu tiêu dùng của xã hội.", "w": ["Chỉ bao gồm các doanh nghiệp nhà nước.", "Là những người tiêu thụ hàng hóa cuối cùng.", "Là ngân hàng trung ương và các tổ chức tín dụng."]}, {"q": "Chủ thể tiêu dùng là chủ thể:", "a": "Mua hàng hóa, dịch vụ trên thị trường để thỏa mãn nhu cầu tiêu dùng.", "w": ["Cung cấp yếu tố đầu vào cho sản xuất.", "Điều tiết các mối quan hệ kinh tế vĩ mô.", "Làm trung gian giữa người mua và ng , "Lợi nhuận độc quyền.", "Lợi tức cho vay."]}, {"q": "Quá trình tái sản xuất xã hội gồm có mấy khâu?", "a": "Bốn khâu: sản xuất - phân phối - trao đổi - tiêu dùng.", "w": ["Hai khâu: sản xuất - tiêu dùng.", "Ba khâu: sản xuất - lưu thông - tiêu dùng.", "Năm khâu: sản xuất - phân phối - trao đổi - lưu thông - tiêu dùng."]}, {"q": "Tiền công là:", "a": "Giá cả của hàng hóa sức lao động.", "w": ["Giá trị của lao động.", "Phần chia lợi nhuận của nhà tư bản cho công nhân.", "Giá trị do công nhân tạo ra trong cả ngày lao động."]}, {"q": "Giá trị thặng dư là gì?", "a": "Phần giá trị mới dôi ra ngoài giá trị sức lao động do người công nhân làm thuê tạo ra bị nhà tư bản chiếm không.", "w": ["Là lợi nhuận thu được từ việc chênh lệch giá mua và bán.", "Là tiền tiết kiệm của nhà tư bản sau quá trình sản xuất.", "Là phần thưởng cho sự quản lý tài ba của nhà tư bản."]}, {"q": "Theo quan niệm của P. Samuelson, lợi nhuận là:", "a": "Phần thu nhập thặng dư tính bằng hiệu quả giữa tổng doanh thu trừ đi tổng chi phí.", "w": ["Hình thái biến tướng của giá trị thặng dư.", "Phần giá trị do lao động thặng dư tạo ra.", "Sự chênh lệch giữa tư bản khả biến và bất biến."]}, {"q": "So sánh giữa tỷ suất lợi nhuận và tỷ suất giá trị thặng dư? Chọn đáp án đúng?", "a": "p' < m'.", "w": ["p' > m'.", "p' = m'.", "Không thể so sánh được."]}, {"q": "Ý kiến nào dưới đây là sai?", "a": "Tích luỹ cơ bản là sự tiết kiệm tư bản.", "w": ["Tích lũy tư bản là biến một phần giá trị thặng dư thành tư bản.", "Nguồn gốc của tích lũy tư bản là giá trị thặng dư.", "Tích lũy tư bản làm tăng cấu tạo hữu cơ của tư bản."]}, {"q": "Nguồn gốc của tích luỹ tư bản là:", "a": "Giá trị thặng dư.", "w": ["Lợi nhuận thương nghiệp.", "Tiết kiệm tiêu dùng của nhà tư bản.", "Vay vốn từ ngân hàng."]}];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let userAnswers = []; // Lưu trữ câu trả lời của người dùng
        
        let timeLeft = 90 * 60; // 90 phút quy ra giây
        let timerInterval;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = `Thời gian: ${formatTime(timeLeft)}`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `Thời gian: ${formatTime(timeLeft)}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Đã hết thời gian làm bài! Hệ thống tự động nộp bài.");
                    showResults();
                }
            }, 1000);
        }

        function initQuiz() {
            questions = shuffle([...quizData]);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(questions.length).fill(null);
            timeLeft = 90 * 60;
            
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('review-container').style.display = 'none';
            document.getElementById('toggle-review-btn').innerText = "Xem Lại Câu Sai";
            
            startTimer();
            loadQuestion();
        }

        function loadQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            document.getElementById('question-number').innerText = `Câu ${currentQuestionIndex + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = currentQuestion.q;
            
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            // Ẩn nút Next nếu chưa chọn câu trả lời
            document.getElementById('next-btn').style.display = userAnswers[currentQuestionIndex] !== null ? 'block' : 'none';

            let options = [...currentQuestion.w, currentQuestion.a];
            
            const hasAllCorrectOption = options.some(opt => opt.includes('Cả A') || opt.includes('đều đúng'));
            if (!hasAllCorrectOption) {
                options = shuffle(options);
            } else {
                const allOpt = options.find(opt => opt.includes('Cả A') || opt.includes('đều đúng'));
                const restOpts = shuffle(options.filter(opt => opt !== allOpt));
                options = [...restOpts, allOpt];
            }

            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.innerText = option;
                
                // Giữ lại lựa chọn nếu quay lại (mặc dù hiện tại flow là 1 chiều tiến)
                if (userAnswers[currentQuestionIndex] === option) {
                    button.classList.add('selected');
                }

                button.onclick = () => selectAnswer(button, option);
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedBtn, selectedOption) {
            // Xóa class selected ở tất cả các nút
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('selected');
            });

            // Highlight nút vừa chọn
            selectedBtn.classList.add('selected');
            
            // Lưu câu trả lời
            userAnswers[currentQuestionIndex] = selectedOption;

            // Hiện nút tiếp theo
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            clearInterval(timerInterval); // Dừng thời gian
            
            // Tính điểm
            score = 0;
            for(let i = 0; i < questions.length; i++) {
                if(userAnswers[i] === questions[i].a) {
                    score++;
                }
            }

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            
            let feedback = document.getElementById('feedback-message');
            const percent = score / questions.length;
            if (percent >= 0.9) {
                feedback.innerText = 'Xuất sắc! Bạn nắm kiến thức môn này rất vững.';
            } else if (percent >= 0.7) {
                feedback.innerText = 'Rất tốt! Chỉ cần ôn lại một chút nữa là hoàn hảo.';
            } else if (percent >= 0.5) {
                feedback.innerText = 'Khá ổn! Bạn nên đọc lại tài liệu để chắc chắn hơn nhé.';
            } else {
                feedback.innerText = 'Bạn cần dành thêm thời gian ôn tập học phần này rồi!';
            }
            
            generateReviewUI();
        }

        function generateReviewUI() {
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = ''; 
            
            let wrongCount = 0;

            for(let i = 0; i < questions.length; i++) {
                if(userAnswers[i] !== questions[i].a) {
                    wrongCount++;
                    const reviewItem = document.createElement('div');
                    reviewItem.className = 'review-item';
                    
                    const userAnswerText = userAnswers[i] ? userAnswers[i] : "Chưa trả lời";
                    
                    reviewItem.innerHTML = `
                        <div class="review-question">Câu ${i+1}: ${questions[i].q}</div>
                        <div class="review-wrong">❌ Bạn chọn: ${userAnswerText}</div>
                        <div class="review-correct">✅ Đáp án đúng: ${questions[i].a}</div>
                    `;
                    reviewContainer.appendChild(reviewItem);
                }
            }

            if(wrongCount === 0) {
                reviewContainer.innerHTML = '<div style="text-align:center; color: #10b981; font-weight:bold; margin-top:20px;">Tuyệt vời! Bạn không sai câu nào.</div>';
            }
        }

        function toggleReview() {
            const reviewContainer = document.getElementById('review-container');
            const toggleBtn = document.getElementById('toggle-review-btn');
            
            if (reviewContainer.style.display === 'none' || reviewContainer.style.display === '') {
                reviewContainer.style.display = 'block';
                toggleBtn.innerText = "Ẩn Xem Lại";
            } else {
                reviewContainer.style.display = 'none';
                toggleBtn.innerText = "Xem Lại Câu Sai";
            }
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
